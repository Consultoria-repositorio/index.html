name: Actualizar Apreciación de Situación

# Ejecuta el análisis político con la API de Claude una vez por semana
# (lunes 06:00 UTC) y también de forma manual desde la pestaña Actions.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apreciacion
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --prefix scripts

      - name: Generar apreciación con Claude
        env:
          # Usa ANTHROPIC_API_KEY si existe; si no, cae a CONTEXTO (nombre alterno del secret).
          # Recomendado a futuro: crear el secret como ANTHROPIC_API_KEY y borrar CONTEXTO.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CONTEXTO }}
        run: node scripts/generar-apreciacion.mjs

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "apreciacion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/apreciacion.json data/apreciacion-history
          if git diff --staged --quiet; then
            echo "Sin cambios en la apreciación; no se hace commit."
          else
            git commit -m "chore: apreciación de situación $(date -u +%Y-%m-%d)"
            git push
          fi
